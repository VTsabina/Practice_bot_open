<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ЭКРАН 1: Главная -->
    <div id="screen-home" class="screen active">
        <h1>Привет, <span id="username">студент</span>!</h1>
        <p>Выбери уровень, и вперёд.</p>
        <button class="btn" data-level="basic">Начальный</button>
        <button class="btn" data-level="advanced">Базовый</button>
    </div>

    <!-- ЭКРАН 2: Меню режимов -->
    <div id="screen-menu" class="screen">
        <button class="back" data-back="home">← Назад</button>
        <h2>Режимы</h2>
        <button class="btn" data-mode="bank">Банк заданий</button>
        <button class="btn" data-mode="sr">Подготовка к СР</button>
        <button class="btn" data-mode="topic">Выбор темы</button>
        <button class="btn" data-mode="random">Случайный тест</button>
    </div>

    <!-- ЭКРАН 3: Выбор параметра -->
    <div id="screen-picker" class="screen">
        <button class="back" data-back="menu">← Назад</button>
        <h2 id="picker-title">Выбери</h2>
        <div id="picker-list"></div>
    </div>

    <!-- ЭКРАН 4: Тест -->
    <div id="screen-test" class="screen">
        <button class="back" data-back="menu">← Выйти</button>
        <div class="test-header">
            <span id="test-progress">Вопрос 1 из 10</span>
            <button id="btn-check">Проверить</button>
        </div>
        <div id="question-map"></div>
        <div id="question-area"></div>
        <div class="test-nav">
            <button id="btn-prev">← Назад</button>
            <button id="btn-next">Далее →</button>
        </div>
    </div>

    <!-- ЭКРАН 5: Результаты -->
    <div id="screen-results" class="screen">
        <h2>Результаты</h2>
        <p id="results-summary"></p>
        <div id="results-list"></div>
        <button class="btn" id="btn-retry">Пройти ещё раз</button>
        <button class="btn" data-back="menu">В меню</button>
    </div>

    <script src="app.js"></script>
</body>

</html>
