<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>

<body>
    <!-- ЭКРАН 1: Главная -->
    <div id="screen-home" class="screen active">
        <h1>Привет, <span id="username">студент</span>!</h1>
        <p>Выбери уровень, и вперёд.</p>
        <button class="btn btn-primary" data-level="start">Начальный</button>
        <button class="btn btn-primary" data-level="basic">Базовый</button>
    </div>

    <!-- ЭКРАН 2: Меню режимов -->
    <div id="screen-menu" class="screen">
        <button class="back" data-back="home">← Назад</button>
        <h2>Режимы</h2>
        <button class="btn" data-mode="theory">📖 Теория</button>
        <button class="btn" data-mode="bank">📚 Банк заданий</button>
        <button class="btn" data-mode="sr">📝 Подготовка к СР</button>
        <button class="btn" data-mode="topic">🎯 Выбор темы</button>
        <button class="btn" data-mode="random">🎲 Случайный тест</button>
    </div>

    <!-- ЭКРАН: Список тем теории -->
    <div id="screen-theory-list" class="screen">
        <button class="back" data-back="menu">← Назад</button>
        <h2>Теория</h2>
        <p class="theory-disclaimer">
            Теория в этом разделе не заменяет учебник и является дополнением к нему.
            Учебник можно найти по ссылке:
            <a href="https://edu.hse.ru/course/view.php?id=133389" target="_blank">edu.hse.ru</a>
        </p>
        <div id="theory-list"></div>
    </div>

    <!-- ЭКРАН: Детали темы -->
    <div id="screen-theory-detail" class="screen">
        <button class="back" id="btn-theory-back">← К списку тем</button>
        <h2 id="theory-title"></h2>
        <div id="theory-content"></div>
    </div>

    <!-- ЭКРАН 3: Выбор параметра -->
    <div id="screen-picker" class="screen">
        <button class="back" data-back="menu">← Назад</button>
        <h2 id="picker-title">Выбери</h2>
        <div id="picker-list"></div>
    </div>

    <!-- ЭКРАН 3.5: Выбор количества -->
    <div id="screen-count" class="screen">
        <button class="back" id="btn-count-back">← Назад</button>
        <h2>Сколько заданий?</h2>
        <p id="count-hint"></p>
        <select id="count-select"></select>
        <button class="btn btn-primary" id="btn-start-count">Начать</button>
    </div>

    <!-- ЭКРАН 4: Тест -->
    <div id="screen-test" class="screen">
        <button class="back" id="btn-test-back">← Назад</button>
        <div class="test-header">
            <span id="test-progress">Вопрос 1 из 10</span>
            <button id="btn-check">Проверить</button>
        </div>
        <div id="question-map"></div>
        <div id="question-area"></div>
        <div class="test-nav">
            <button id="btn-prev">← Назад</button>
            <button id="btn-next">Далее →</button>
        </div>
    </div>

    <!-- ЭКРАН 5: Результаты -->
    <div id="screen-results" class="screen">
        <p id="results-summary"></p>
        <div id="results-list"></div>
        <button class="btn" id="btn-retry">Пройти ещё раз</button>
        <button class="btn btn-primary" id="btn-results-back">← Назад</button>
    </div>

    <script src="theory.js"></script>
    <script src="questions.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
